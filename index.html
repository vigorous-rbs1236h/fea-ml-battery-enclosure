<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>EV Battery Enclosure Optimizer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "numpy", "scikit-learn", "plotly", "openpyxl"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "data.xlsx": { url: "./data.xlsx" },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
